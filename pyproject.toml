[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tamil-voice-clone"
version = "0.1.0"
description = "Lightweight zero-shot Tamil, English and Tanglish voice-cloning runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "soundfile>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]
onnx = [
  "onnxruntime>=1.18,<2",
]

[project.scripts]
tvc = "tamil_voice_clone.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
