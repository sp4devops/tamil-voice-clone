name: ci

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Compile all Python files
        run: |
          python -m compileall -q src tests training scripts
      - name: Lint reusable package and tests
        run: ruff check src tests training
      - name: Run unit and quality-pipeline tests
        run: pytest
