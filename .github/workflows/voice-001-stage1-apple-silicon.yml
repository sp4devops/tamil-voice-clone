name: voice-001-stage1-apple-silicon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/voice-001-stage1-apple-silicon.yml'
      - 'scripts/prepare_stage1_reference_text.py'
      - 'scripts/run_indicf5_stage1_runtime_benchmark.py'
      - 'scripts/run_indicf5_stage1_multilingual.py'
      - 'scripts/run_indicf5_diagnostic.py'
      - 'scripts/run_dhee_baseline.py'
      - '.github/reference/voice_001_ref_exact_4s.*'

concurrency:
  group: voice-001-stage1-apple-silicon
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-apple-silicon-runtime:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      VOICE_001_KEY: ${{ secrets.VOICE_001_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HOME: /Users/runner/.cache/huggingface
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
      TOKENIZERS_PARALLELISM: 'false'
      PYTORCH_ENABLE_MPS_FALLBACK: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(arch)" = 'arm64'
          printf 'runner_arch=%s\n' "$(arch)"
          printf 'runner_memory_bytes=%s\n' "$(sysctl -n hw.memsize)"
          sw_vers

      - name: Restore pip and model caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/Library/Caches/pip
            ~/.cache/huggingface
          key: voice-001-indicf5-${{ runner.os }}-${{ runner.arch }}-py310-v2
          restore-keys: |
            voice-001-indicf5-${{ runner.os }}-${{ runner.arch }}-py310-

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          python -m pip install --upgrade pip
          pip install 'torch==2.6.0' 'torchaudio==2.6.0'
          pip install \
            'transformers==4.49.0' 'accelerate==0.33.0' \
            'numpy==1.26.4' 'soundfile>=0.12,<1' \
            'huggingface-hub>=0.27,<1' 'safetensors>=0.4.5' \
            'vocos==0.1.0' 'pydub==0.25.1' 'librosa>=0.10.2,<1' \
            'matplotlib>=3.8,<4' 'torchdiffeq>=0.2.4' \
            'ema-pytorch>=0.5.2' 'x-transformers>=1.31.14' \
            'faster-whisper==1.2.0' \
            cached_path click hydra-core jieba pypinyin tomli tqdm
          pip install --no-deps \
            git+https://github.com/AI4Bharat/IndicF5.git@13f7c4d627cc10111aea8fe9c0039462cacacdc7
          python - <<'PY'
          from pathlib import Path
          import f5_tts

          package = Path(f5_tts.__file__).parent

          model_init = package / 'model' / '__init__.py'
          text = model_init.read_text(encoding='utf-8')
          text = text.replace('from f5_tts.model.trainer import Trainer\n', '')
          text = text.replace(', "Trainer"', '')
          model_init.write_text(text, encoding='utf-8')

          utils = package / 'infer' / 'utils_infer.py'
          text = utils.read_text(encoding='utf-8')
          eager_matplotlib = (
              'import matplotlib\n\n'
              'matplotlib.use("Agg")\n\n'
              'import matplotlib.pylab as plt\n'
          )
          if eager_matplotlib not in text:
              raise SystemExit('IndicF5 matplotlib import block changed')
          text = text.replace(eager_matplotlib, '')

          eager_pipeline = 'from transformers import pipeline\n'
          if eager_pipeline not in text:
              raise SystemExit('IndicF5 transformers pipeline import changed')
          text = text.replace(eager_pipeline, '')

          asr_marker = 'def initialize_asr_pipeline(device: str = device, dtype=None):\n'
          if asr_marker not in text:
              raise SystemExit('IndicF5 ASR initializer changed')
          text = text.replace(
              asr_marker,
              asr_marker + '    from transformers import pipeline\n',
              1,
          )

          spectrogram_marker = 'def save_spectrogram(spectrogram, path):\n'
          if spectrogram_marker not in text:
              raise SystemExit('IndicF5 spectrogram helper changed')
          text = text.replace(
              spectrogram_marker,
              spectrogram_marker
              + '    import matplotlib\n'
              + '    matplotlib.use("Agg")\n'
              + '    import matplotlib.pylab as plt\n',
              1,
          )
          utils.write_text(text, encoding='utf-8')
          print('lean_runtime_import_patch=PASS')
          PY

      - name: Recover protected reference pair
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VOICE_001_KEY"
          test -n "$HF_TOKEN"
          mkdir -p data/private outputs/stage1_apple_silicon_runtime

          cat .github/reference/voice_001_ref_exact_4s.opus.enc.b64.part* \
            | base64 -D > data/private/reference.opus.enc
          base64 -D -i .github/reference/voice_001_ref_exact_4s.txt.enc.b64 \
            > data/private/reference.txt.enc

          OPENSSL_BIN="$(brew --prefix openssl@3)/bin/openssl"
          "$OPENSSL_BIN" enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
            -in data/private/reference.opus.enc \
            -out data/private/reference.opus \
            -pass env:VOICE_001_KEY
          "$OPENSSL_BIN" enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
            -in data/private/reference.txt.enc \
            -out data/private/reference.txt \
            -pass env:VOICE_001_KEY

          ffmpeg -y -hide_banner -loglevel error \
            -i data/private/reference.opus \
            -ac 1 -ar 24000 -c:a pcm_s16le \
            data/private/reference.wav

      - name: Prepare private aligned reference text
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_stage1_reference_text.py \
            --reference data/private/reference.wav \
            --reference-text-file data/private/reference.txt \
            --output-file data/private/effective_reference.txt
          test -s data/private/effective_reference.txt

      - name: Prepare listening-sample retention
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/run_indicf5_stage1_runtime_benchmark.py')
          text = path.read_text(encoding='utf-8')

          old_name = 'wav_path = output_dir / f".{target_name}_runtime.wav"'
          new_name = 'wav_path = output_dir / f"{target_name}_listening_sample.wav"'
          if old_name not in text:
              raise SystemExit('Runtime sample filename block changed')
          text = text.replace(old_name, new_name, 1)

          old_cleanup = (
              '    finally:\n'
              '        for wav_path in transient_wavs:\n'
              '            wav_path.unlink(missing_ok=True)\n'
          )
          new_cleanup = '    finally:\n        pass\n'
          if old_cleanup not in text:
              raise SystemExit('Runtime sample cleanup block changed')
          text = text.replace(old_cleanup, new_cleanup, 1)
          path.write_text(text, encoding='utf-8')
          print('runtime_listening_sample_retention=PASS')
          PY

      - name: Measure TTS-only Stage 1 runtime
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -l python scripts/run_indicf5_stage1_runtime_benchmark.py \
            --reference data/private/reference.wav \
            --effective-reference-text-file data/private/effective_reference.txt \
            --output-dir outputs/stage1_apple_silicon_runtime \
            2> >(tee outputs/stage1_apple_silicon_runtime/resource_usage.txt >&2)

      - name: Build TTS-only Apple Silicon benchmark report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import platform
          import re
          import subprocess
          from pathlib import Path

          output_dir = Path('outputs/stage1_apple_silicon_runtime')
          runtime = json.loads((output_dir / 'runtime_report.json').read_text(encoding='utf-8'))
          usage = (output_dir / 'resource_usage.txt').read_text(encoding='utf-8', errors='replace')
          match = re.search(r'(?m)^\s*(\d+)\s+maximum resident set size\s*$', usage)
          if not match:
              raise SystemExit('Could not parse macOS maximum resident set size')

          max_rss_bytes = int(match.group(1))
          physical_memory_bytes = int(subprocess.check_output(['sysctl', '-n', 'hw.memsize'], text=True).strip())
          hard_ceiling_bytes = 3 * 1024 ** 3
          benchmark = {
              'status': 'PASS' if max_rss_bytes <= hard_ceiling_bytes else 'MEMORY_CEILING_EXCEEDED',
              'runner': 'macos-14',
              'architecture': platform.machine(),
              'measurement_scope': 'TTS_ONLY_PROCESS_NO_WHISPER_MODEL_LAZY_PLOTTING_IMPORTS',
              'physical_memory_bytes': physical_memory_bytes,
              'physical_memory_gib': round(physical_memory_bytes / (1024 ** 3), 3),
              'maximum_resident_set_bytes': max_rss_bytes,
              'maximum_resident_set_gib': round(max_rss_bytes / (1024 ** 3), 3),
              'hard_memory_ceiling_bytes': hard_ceiling_bytes,
              'hard_memory_ceiling_gib': 3.0,
              'meets_hard_3gib_ceiling': max_rss_bytes <= hard_ceiling_bytes,
              'model_id': runtime['model_id'],
              'model_load_seconds': runtime['model_load_seconds'],
              'effective_weights_verified': runtime['effective_weights_verified'],
              'targets': runtime['targets'],
          }
          if platform.machine() != 'arm64':
              raise SystemExit('Apple Silicon benchmark did not run on arm64')
          (output_dir / 'apple_silicon_runtime_benchmark.json').write_text(
              json.dumps(benchmark, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print('tts_only_peak_rss_gib=' + str(benchmark['maximum_resident_set_gib']))
          print('meets_hard_3gib_ceiling=' + str(benchmark['meets_hard_3gib_ceiling']).lower())
          PY

      - name: Validate safe benchmark outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s outputs/stage1_apple_silicon_runtime/runtime_report.json
          test -s outputs/stage1_apple_silicon_runtime/apple_silicon_runtime_benchmark.json
          test -s outputs/stage1_apple_silicon_runtime/english_listening_sample.wav
          test -s outputs/stage1_apple_silicon_runtime/mixed_listening_sample.wav

      - name: Verify listening samples outside measured runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('scripts').resolve()))
          from faster_whisper import WhisperModel
          from run_indicf5_stage1_multilingual import TARGETS, verify_english, verify_mixed

          output_dir = Path('outputs/stage1_apple_silicon_runtime')
          verifier = WhisperModel(
              'large-v3-turbo',
              device='cpu',
              compute_type='int8',
              cpu_threads=4,
              num_workers=1,
          )

          english_path = output_dir / 'english_listening_sample.wav'
          mixed_path = output_dir / 'mixed_listening_sample.wav'
          english = verify_english(verifier, english_path, str(TARGETS['english']['text']))
          mixed = verify_mixed(verifier, mixed_path, str(TARGETS['mixed']['text']))
          accepted = bool(english['accepted'] and mixed['accepted'])
          report = {
              'status': 'PASS' if accepted else 'REJECTED_STRICT_ASR_GATE',
              'english': english,
              'mixed': mixed,
          }
          (output_dir / 'listening_sample_verification.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print('listening_sample_verification=' + ('PASS' if accepted else 'FAIL'))
          if not accepted:
              english_path.unlink(missing_ok=True)
              mixed_path.unlink(missing_ok=True)
              raise SystemExit('Runtime listening samples rejected by strict ASR gate')
          PY

      - name: Upload verified Stage 1 listening samples
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: voice-001-stage1-apple-silicon-listening-samples
          path: |
            outputs/stage1_apple_silicon_runtime/english_listening_sample.wav
            outputs/stage1_apple_silicon_runtime/mixed_listening_sample.wav
            outputs/stage1_apple_silicon_runtime/listening_sample_verification.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove protected and transient material
        if: always()
        shell: bash
        run: |
          rm -rf data/private
          rm -f outputs/stage1_apple_silicon_runtime/*.wav
          rm -f outputs/stage1_apple_silicon_runtime/resource_usage.txt

      - name: Upload safe TTS-only Apple Silicon benchmark
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: voice-001-stage1-apple-silicon-runtime-benchmark
          path: |
            outputs/stage1_apple_silicon_runtime/runtime_report.json
            outputs/stage1_apple_silicon_runtime/apple_silicon_runtime_benchmark.json
            outputs/stage1_apple_silicon_runtime/listening_sample_verification.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce hard 3 GiB Stage 1 runtime ceiling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('outputs/stage1_apple_silicon_runtime/apple_silicon_runtime_benchmark.json').read_text(encoding='utf-8'))
          if not report['meets_hard_3gib_ceiling']:
              raise SystemExit(
                  f"TTS-only peak RSS {report['maximum_resident_set_gib']} GiB exceeds hard 3 GiB ceiling"
              )
          print('stage1_runtime_memory_gate=PASS')
          PY
