name: voice-001-indicf5-exact-reference

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/voice-001-indicf5-exact-reference.yml'
      - '.github/reference/voice_001_ref_exact_4s.*'
      - 'scripts/run_dhee_baseline.py'
      - 'scripts/run_tail_conditioned_gate.py'
      - 'scripts/run_indicf5_diagnostic.py'

concurrency:
  group: voice-001-indicf5-exact-reference
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  synthesize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VOICE_001_KEY: ${{ secrets.VOICE_001_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HOME: /home/runner/.cache/huggingface
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'

      - name: Restore pip and model caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: voice-001-indicf5-${{ runner.os }}-py310-v2
          restore-keys: |
            voice-001-indicf5-${{ runner.os }}-py310-

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg git
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.6.0' 'torchaudio==2.6.0'
          pip install \
            'transformers==4.49.0' 'accelerate==0.33.0' \
            'numpy==1.26.4' 'soundfile>=0.12,<1' \
            'huggingface-hub>=0.27,<1' 'safetensors>=0.4.5' \
            'vocos==0.1.0' 'pydub==0.25.1' 'librosa>=0.10.2,<1' \
            'matplotlib>=3.8,<4' 'torchdiffeq>=0.2.4' \
            'ema-pytorch>=0.5.2' 'x-transformers>=1.31.14' \
            'faster-whisper==1.2.0' \
            cached_path click hydra-core jieba pypinyin tomli tqdm
          pip install --no-deps \
            git+https://github.com/AI4Bharat/IndicF5.git@13f7c4d627cc10111aea8fe9c0039462cacacdc7
          python - <<'PY'
          from pathlib import Path
          import f5_tts
          path = Path(f5_tts.__file__).parent / 'model' / '__init__.py'
          text = path.read_text(encoding='utf-8')
          text = text.replace('from f5_tts.model.trainer import Trainer\n', '')
          text = text.replace(', "Trainer"', '')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Recover exact protected reference pair
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VOICE_001_KEY"
          test -n "$HF_TOKEN"
          mkdir -p data/private outputs/voice_001_diagnostic

          cat .github/reference/voice_001_ref_exact_4s.opus.enc.b64.part* \
            | base64 -d > data/private/reference.opus.enc
          base64 -d .github/reference/voice_001_ref_exact_4s.txt.enc.b64 \
            > data/private/reference.txt.enc

          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
            -in data/private/reference.opus.enc \
            -out data/private/reference.opus \
            -pass env:VOICE_001_KEY
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
            -in data/private/reference.txt.enc \
            -out data/private/reference.txt \
            -pass env:VOICE_001_KEY

          ffmpeg -y -hide_banner -loglevel error \
            -i data/private/reference.opus \
            -ac 1 -ar 24000 -c:a pcm_s16le \
            data/private/reference.wav

          duration="$(ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 data/private/reference.wav)"
          python - "$duration" <<'PY'
          import sys
          from pathlib import Path
          duration = float(sys.argv[1])
          text = Path('data/private/reference.txt').read_text(encoding='utf-8').strip()
          if not 4.2 <= duration <= 4.9:
              raise SystemExit(f'Unexpected exact-reference duration: {duration:.3f}s')
          if len(text) < 8 or not any('\u0b80' <= ch <= '\u0bff' for ch in text):
              raise SystemExit('Protected reference transcript validation failed')
          print(f'Validated protected reference container: duration={duration:.3f}s')
          PY

      - name: Run secure one-phrase diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_indicf5_diagnostic.py \
            --reference data/private/reference.wav \
            --reference-text-file data/private/reference.txt \
            --output-dir outputs/voice_001_diagnostic

      - name: Encrypt approved diagnostic bundle
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -s outputs/voice_001_diagnostic/diagnostic_direct_short.wav
          test -s outputs/voice_001_diagnostic/report.json
          tar -czf outputs/voice_001_diagnostic.tar.gz \
            -C outputs voice_001_diagnostic
          openssl enc -aes-256-cbc -pbkdf2 -iter 250000 -salt \
            -in outputs/voice_001_diagnostic.tar.gz \
            -out outputs/voice_001_diagnostic.tar.gz.enc \
            -pass env:VOICE_001_KEY

      - name: Remove all plaintext private material
        if: always()
        shell: bash
        run: |
          rm -rf data/private outputs/voice_001_diagnostic \
            outputs/voice_001_diagnostic.tar.gz

      - name: Upload encrypted approved diagnostic
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: voice-001-indicf5-diagnostic-encrypted
          path: outputs/voice_001_diagnostic.tar.gz.enc
          if-no-files-found: error
          retention-days: 1
