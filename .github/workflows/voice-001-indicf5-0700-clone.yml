name: voice-001-indicf5-0700-clone

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/voice-001-indicf5-0700-clone.yml'

concurrency:
  group: voice-001-indicf5-0700-clone
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  synthesize:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CACHE_KEY: voice-001-reference-tY_3TiehDFU-0700-40-v1
      VOICE_001_KEY: ${{ secrets.VOICE_001_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'

    steps:
      - name: Checkout reviewed IndicF5 runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a0414b927782ba97393277ed41dd7c9814f8bbbf
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'

      - name: Install audio transcription and IndicF5 dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg git
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.6.0' 'torchaudio==2.6.0'
          pip install \
            'transformers==4.49.0' \
            'accelerate==0.33.0' \
            'numpy==1.26.4' \
            'soundfile>=0.12,<1' \
            'huggingface-hub>=0.27,<1' \
            'safetensors>=0.4.5' \
            'vocos==0.1.0' \
            'pydub==0.25.1' \
            'librosa>=0.10.2,<1' \
            'matplotlib>=3.8,<4' \
            'torchdiffeq>=0.2.4' \
            'ema-pytorch>=0.5.2' \
            'x-transformers>=1.31.14' \
            'faster-whisper==1.2.0' \
            cached_path click hydra-core jieba pypinyin tomli tqdm
          pip install --no-deps \
            git+https://github.com/AI4Bharat/IndicF5.git@13f7c4d627cc10111aea8fe9c0039462cacacdc7

          python - <<'PY'
          from pathlib import Path
          import f5_tts

          model_init = Path(f5_tts.__file__).parent / 'model' / '__init__.py'
          source = model_init.read_text(encoding='utf-8')
          source = source.replace('from f5_tts.model.trainer import Trainer\n', '')
          source = source.replace(', "Trainer"', '')
          model_init.write_text(source, encoding='utf-8')
          PY

      - name: Validate protected inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VOICE_001_KEY"
          test -n "$HF_TOKEN"
          test -n "$CACHE_KEY"

      - name: Restore encrypted 07:00 voice reference cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: data/private/voice_001_ref.wav.enc
          key: ${{ env.CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Recover exact 07:00-07:30 source window
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/private outputs/voice_001_indicf5_0700
          test -s data/private/voice_001_ref.wav.enc

          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
            -in data/private/voice_001_ref.wav.enc \
            -out data/private/voice_001_ref_40s.wav \
            -pass env:VOICE_001_KEY

          ffmpeg -y -hide_banner -loglevel error \
            -i data/private/voice_001_ref_40s.wav \
            -t 30 -ac 1 -ar 24000 -c:a pcm_s16le \
            data/private/voice_001_ref_0700_0730.wav
          rm -f data/private/voice_001_ref_40s.wav

          duration="$(ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            data/private/voice_001_ref_0700_0730.wav)"
          python - "$duration" <<'PY'
          import sys
          duration = float(sys.argv[1])
          if not 29.5 <= duration <= 30.5:
              raise SystemExit(f'Unexpected protected reference duration: {duration:.3f}s')
          print(f'Validated protected 07:00-07:30 window: {duration:.3f}s')
          PY

      - name: Build exact word-aligned Tamil reference candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import unicodedata
          from difflib import SequenceMatcher
          from pathlib import Path

          import numpy as np
          import soundfile as sf
          from faster_whisper import WhisperModel

          source_path = Path('data/private/voice_001_ref_0700_0730.wav')
          audio, sample_rate = sf.read(source_path, dtype='float32')
          if sample_rate != 24000 or audio.ndim != 1:
              raise SystemExit('Unexpected protected source format')

          whisper = WhisperModel(
              'large-v3-turbo',
              device='cpu',
              compute_type='int8',
              cpu_threads=4,
              num_workers=1,
          )
          raw_segments, _ = whisper.transcribe(
              str(source_path),
              language='ta',
              beam_size=5,
              vad_filter=True,
              condition_on_previous_text=False,
              word_timestamps=True,
              temperature=0,
          )

          tamil_re = re.compile(r'[\u0B80-\u0BFF]')

          def normalize_tamil(text: str) -> str:
              return ''.join(ch for ch in text if tamil_re.match(ch))

          def tamil_fraction(text: str) -> float:
              letters_and_marks = [
                  ch for ch in text
                  if unicodedata.category(ch).startswith(('L', 'M'))
              ]
              if not letters_and_marks:
                  return 0.0
              value = sum(bool(tamil_re.match(ch)) for ch in letters_and_marks) / len(letters_and_marks)
              return min(1.0, max(0.0, value))

          words = []
          for segment in raw_segments:
              segment_probability = max(0.0, min(1.0, 1.0 + float(getattr(segment, 'avg_logprob', -2.0))))
              for word in segment.words or []:
                  text = word.word.strip()
                  start = float(word.start)
                  end = float(word.end)
                  probability = float(getattr(word, 'probability', segment_probability))
                  if not text or end <= start:
                      continue
                  if not normalize_tamil(text):
                      continue
                  words.append({
                      'text': text,
                      'start': start,
                      'end': end,
                      'probability': probability,
                  })

          if len(words) < 4:
              raise SystemExit('Too few timestamped Tamil words found in the protected reference')

          candidates = []
          for left in range(len(words)):
              group = []
              for right in range(left, min(len(words), left + 12)):
                  word = words[right]
                  if group and word['start'] - group[-1]['end'] > 0.45:
                      break
                  group.append(word)
                  duration = group[-1]['end'] - group[0]['start']
                  if duration > 8.2:
                      break
                  if len(group) < 4 or duration < 3.2:
                      continue

                  transcript = ' '.join(item['text'] for item in group).strip()
                  script_fraction = tamil_fraction(transcript)
                  avg_probability = sum(item['probability'] for item in group) / len(group)
                  min_probability = min(item['probability'] for item in group)
                  if script_fraction < 0.88:
                      continue
                  if avg_probability < 0.55 or min_probability < 0.25:
                      continue

                  total_gap = sum(
                      max(0.0, group[index + 1]['start'] - group[index]['end'])
                      for index in range(len(group) - 1)
                  )
                  score = (
                      2.0 * avg_probability
                      + script_fraction
                      - 0.10 * abs(duration - 5.5)
                      - 0.25 * total_gap
                  )
                  candidates.append({
                      'start': group[0]['start'],
                      'end': group[-1]['end'],
                      'duration': duration,
                      'text': transcript,
                      'score': score,
                      'avg_probability': avg_probability,
                      'tamil_fraction': script_fraction,
                  })

          candidates.sort(key=lambda item: item['score'], reverse=True)
          selected = []
          for candidate in candidates:
              overlap = False
              for old in selected:
                  overlap_seconds = max(
                      0.0,
                      min(candidate['end'], old['end']) - max(candidate['start'], old['start']),
                  )
                  if overlap_seconds / min(candidate['duration'], old['duration']) > 0.55:
                      overlap = True
                      break
              if overlap:
                  continue
              selected.append(candidate)
              if len(selected) == 4:
                  break

          if not selected:
              raise SystemExit('No reliable word-aligned Tamil reference window was found')

          created = []
          fade_samples = int(sample_rate * 0.015)
          for index, candidate in enumerate(selected, start=1):
              start = max(0.0, candidate['start'] - 0.025)
              end = min(len(audio) / sample_rate, candidate['end'] + 0.025)
              start_sample = int(round(start * sample_rate))
              end_sample = int(round(end * sample_rate))
              clip = audio[start_sample:end_sample].copy()
              if len(clip) < int(3.0 * sample_rate):
                  continue

              clip[:fade_samples] *= np.linspace(0.0, 1.0, fade_samples, dtype=np.float32)
              clip[-fade_samples:] *= np.linspace(1.0, 0.0, fade_samples, dtype=np.float32)
              peak = float(np.max(np.abs(clip)))
              if peak > 0.98:
                  clip *= 0.98 / peak

              audio_path = Path(f'data/private/reference_candidate_{index}.wav')
              text_path = Path(f'data/private/reference_candidate_{index}.txt')
              sf.write(audio_path, clip, sample_rate, subtype='PCM_16')
              text_path.write_text(candidate['text'], encoding='utf-8')

              verify_segments, _ = whisper.transcribe(
                  str(audio_path),
                  language='ta',
                  beam_size=5,
                  vad_filter=False,
                  condition_on_previous_text=False,
                  temperature=0,
              )
              verified_text = ' '.join(
                  segment.text.strip()
                  for segment in verify_segments
                  if segment.text.strip()
              )
              alignment_similarity = SequenceMatcher(
                  None,
                  normalize_tamil(candidate['text']),
                  normalize_tamil(verified_text),
              ).ratio()
              if alignment_similarity < 0.78:
                  audio_path.unlink(missing_ok=True)
                  text_path.unlink(missing_ok=True)
                  continue

              created.append({
                  'id': index,
                  'duration_seconds': round(len(clip) / sample_rate, 3),
                  'word_alignment_similarity': round(alignment_similarity, 4),
                  'average_word_probability': round(candidate['avg_probability'], 4),
                  'tamil_fraction': round(candidate['tamil_fraction'], 4),
              })

          if not created:
              raise SystemExit('Word-aligned reference clips failed transcript round-trip validation')

          Path('data/private/reference_candidates.json').write_text(
              json.dumps({'count': len(created), 'candidates': created}, indent=2),
              encoding='utf-8',
          )
          print(f'Created {len(created)} exact word-aligned protected reference candidates.')
          PY

      - name: Generate candidates with strict beginning and full-sentence gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import shutil
          import time
          import unicodedata
          from difflib import SequenceMatcher
          from pathlib import Path

          import numpy as np
          import soundfile as sf
          import torch
          from faster_whisper import WhisperModel
          from transformers import AutoModel

          from scripts.run_dhee_baseline import prepare_compatible_snapshot, validate_waveform

          target_text = 'இது தெளிவான இயல்பான தமிழ் குரல்.'
          output_dir = Path('outputs/voice_001_indicf5_0700')
          output_dir.mkdir(parents=True, exist_ok=True)

          token = os.environ.get('HF_TOKEN') or None
          snapshot = prepare_compatible_snapshot(
              'dheeyantra/dhee-indic-f5',
              'AbhishekDelMundu/IndicF5',
              token,
          )
          model_started = time.perf_counter()
          model = AutoModel.from_pretrained(
              snapshot,
              trust_remote_code=True,
              local_files_only=True,
          )
          model_load_seconds = time.perf_counter() - model_started

          verifier = WhisperModel(
              'large-v3-turbo',
              device='cpu',
              compute_type='int8',
              cpu_threads=4,
              num_workers=1,
          )
          tamil_re = re.compile(r'[\u0B80-\u0BFF]')

          def normalize_tamil(text: str) -> str:
              return ''.join(ch for ch in text if tamil_re.match(ch))

          def tamil_fraction(text: str) -> float:
              letters_and_marks = [
                  ch for ch in text
                  if unicodedata.category(ch).startswith(('L', 'M'))
              ]
              if not letters_and_marks:
                  return 0.0
              value = sum(bool(tamil_re.match(ch)) for ch in letters_and_marks) / len(letters_and_marks)
              return min(1.0, max(0.0, value))

          target_normalized = normalize_tamil(target_text)
          prefix_length = max(8, int(len(target_normalized) * 0.55))
          target_prefix = target_normalized[:prefix_length]
          attempts = []
          best = None

          for reference_path in sorted(Path('data/private').glob('reference_candidate_*.wav')):
              candidate_id = int(reference_path.stem.rsplit('_', 1)[-1])
              reference_text = reference_path.with_suffix('.txt').read_text(encoding='utf-8').strip()

              for seed in (11, 29, 47):
                  output_path = Path(f'data/private/generated_candidate_{candidate_id}_seed_{seed}.wav')
                  try:
                      torch.manual_seed(seed)
                      np.random.seed(seed)
                      started = time.perf_counter()
                      generated = model(
                          target_text,
                          ref_audio_path=str(reference_path),
                          ref_text=reference_text,
                      )
                      waveform = np.asarray(generated)
                      if waveform.dtype == np.int16:
                          waveform = waveform.astype(np.float32) / 32768.0
                      waveform = waveform.astype(np.float32).reshape(-1)
                      signal_metrics = validate_waveform(
                          waveform,
                          f'candidate_{candidate_id}_seed_{seed}',
                      )
                      duration = len(waveform) / 24000
                      sf.write(output_path, waveform, 24000, subtype='PCM_16')

                      verify_segments, _ = verifier.transcribe(
                          str(output_path),
                          language='ta',
                          beam_size=5,
                          vad_filter=True,
                          condition_on_previous_text=False,
                          word_timestamps=True,
                          temperature=0,
                      )
                      hypothesis = ' '.join(
                          segment.text.strip()
                          for segment in verify_segments
                          if segment.text.strip()
                      )
                      hypothesis_normalized = normalize_tamil(hypothesis)
                      overall_similarity = SequenceMatcher(
                          None,
                          target_normalized,
                          hypothesis_normalized,
                      ).ratio()
                      hypothesis_prefix = hypothesis_normalized[:prefix_length]
                      prefix_similarity = SequenceMatcher(
                          None,
                          target_prefix,
                          hypothesis_prefix,
                      ).ratio()
                      script_fraction = tamil_fraction(hypothesis)
                      length_ratio = len(hypothesis_normalized) / max(1, len(target_normalized))
                      duration_ok = 2.0 <= duration <= 8.5
                      length_ok = 0.78 <= length_ratio <= 1.30
                      accepted = (
                          duration_ok
                          and length_ok
                          and overall_similarity >= 0.86
                          and prefix_similarity >= 0.82
                          and script_fraction >= 0.90
                      )
                      elapsed = time.perf_counter() - started

                      result = {
                          'candidate_id': candidate_id,
                          'seed': seed,
                          'duration_seconds': round(duration, 3),
                          'generation_seconds': round(elapsed, 3),
                          'overall_asr_similarity': round(overall_similarity, 4),
                          'prefix_asr_similarity': round(prefix_similarity, 4),
                          'tamil_fraction': round(script_fraction, 4),
                          'normalized_length_ratio': round(length_ratio, 4),
                          'duration_ok': duration_ok,
                          'length_ok': length_ok,
                          'accepted': accepted,
                          **signal_metrics,
                      }
                      attempts.append(result)
                      print(
                          f'Candidate {candidate_id} seed {seed}: '
                          f'overall={overall_similarity:.3f}, '
                          f'prefix={prefix_similarity:.3f}, '
                          f'tamil={script_fraction:.3f}, '
                          f'length={length_ratio:.3f}, accepted={accepted}'
                      )

                      rank = (
                          0.65 * overall_similarity
                          + 0.30 * prefix_similarity
                          + 0.05 * script_fraction
                          - 0.02 * abs(duration - 4.5)
                      )
                      if accepted and (best is None or rank > best['rank']):
                          best = {
                              'rank': rank,
                              'path': output_path,
                              'result': result,
                          }
                  except Exception as exc:
                      attempts.append({
                          'candidate_id': candidate_id,
                          'seed': seed,
                          'accepted': False,
                          'error_type': type(exc).__name__,
                      })
                      print(
                          f'Candidate {candidate_id} seed {seed} rejected with '
                          f'{type(exc).__name__}; details suppressed.'
                      )

          report_path = output_dir / 'strict_intelligibility_report.json'
          if best is None:
              report_path.write_text(
                  json.dumps({
                      'status': 'REJECTED_NO_FULLY_INTELLIGIBLE_OUTPUT',
                      'model_load_seconds': model_load_seconds,
                      'target_text': target_text,
                      'thresholds': {
                          'overall_asr_similarity': 0.86,
                          'prefix_asr_similarity': 0.82,
                          'tamil_fraction': 0.90,
                          'length_ratio_min': 0.78,
                          'length_ratio_max': 1.30,
                      },
                      'attempts': attempts,
                  }, ensure_ascii=False, indent=2),
                  encoding='utf-8',
              )
              raise SystemExit(
                  'All outputs failed the strict beginning/full-sentence intelligibility gates; no audio uploaded'
              )

          final_path = output_dir / 'tamil_clone_0700_word_aligned.wav'
          shutil.copyfile(best['path'], final_path)
          report_path.write_text(
              json.dumps({
                  'status': 'PENDING_HUMAN_LISTENING_REVIEW',
                  'model_load_seconds': model_load_seconds,
                  'target_text': target_text,
                  'selected_metrics': best['result'],
                  'attempts': attempts,
              }, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          print('Selected one output that passed strict prefix and full-sentence checks.')
          PY

      - name: Validate encrypt and remove private material
        shell: bash
        run: |
          set -euo pipefail
          test -s outputs/voice_001_indicf5_0700/tamil_clone_0700_word_aligned.wav
          duration="$(ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            outputs/voice_001_indicf5_0700/tamil_clone_0700_word_aligned.wav)"
          python - "$duration" <<'PY'
          import sys
          duration = float(sys.argv[1])
          if not 2.0 <= duration <= 8.5:
              raise SystemExit(f'Final duration gate failed: {duration:.3f}s')
          print(f'Final strict sample duration: {duration:.3f}s')
          PY

          tar -czf outputs/voice_001_indicf5_0700_word_aligned.tar.gz \
            -C outputs voice_001_indicf5_0700
          openssl enc -aes-256-cbc -pbkdf2 -iter 250000 -salt \
            -in outputs/voice_001_indicf5_0700_word_aligned.tar.gz \
            -out outputs/voice_001_indicf5_0700_word_aligned.tar.gz.enc \
            -pass env:VOICE_001_KEY

          rm -rf \
            data/private \
            outputs/voice_001_indicf5_0700 \
            outputs/voice_001_indicf5_0700_word_aligned.tar.gz

      - name: Remove private material after failure
        if: failure()
        shell: bash
        run: rm -rf data/private outputs/voice_001_indicf5_0700

      - name: Upload encrypted strict Tamil gate only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: voice-001-indicf5-0700-word-aligned-encrypted
          path: outputs/voice_001_indicf5_0700_word_aligned.tar.gz.enc
          if-no-files-found: error
          retention-days: 1
