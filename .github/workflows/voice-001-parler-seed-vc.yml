name: voice-001-parler-seed-vc

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/voice-001-parler-seed-vc.yml'

concurrency:
  group: voice-001-parler-seed-vc
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  synthesize:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      REVIEWED_CODE_SHA: a0414b927782ba97393277ed41dd7c9814f8bbbf
      REFERENCE_VIDEO_URL: https://www.youtube.com/watch?v=tY_3TiehDFU
      REFERENCE_VIDEO_ID: tY_3TiehDFU
      REFERENCE_START: '00:07:00'
      REFERENCE_DURATION_SECONDS: '40'
      YT_DLP_VERSION: '2026.07.04'
      YT_DLP_SHA256: 495be29ff4d9d4e9be7eabdfef225221e5d5282e77f2f505abc6dca80349f3fd
      SEED_VC_SHA: 51383efd921027683c89e5348211d93ff12ac2a8
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
      VOICE_001_KEY: ${{ secrets.VOICE_001_KEY }}
      YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
      HF_HOME: ${{ github.workspace }}/.hf-cache
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout reviewed benchmark commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.REVIEWED_CODE_SHA }}
          persist-credentials: false

      - name: Verify immutable checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$REVIEWED_CODE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          python -m compileall -q scripts

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libsndfile1 git ca-certificates curl
          python -m pip install --upgrade pip virtualenv
          node --version
          node_major="$(node --version | sed -E 's/^v([0-9]+).*/\1/')"
          test "$node_major" -ge 22

      - name: Validate protected inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN"
          test -n "$VOICE_001_KEY"
          test -n "$REFERENCE_VIDEO_URL"
          test -n "$REFERENCE_VIDEO_ID"
          test -n "$REFERENCE_START"
          test -n "$REFERENCE_DURATION_SECONDS"
          test -n "$YT_DLP_VERSION"
          test -n "$YT_DLP_SHA256"

      - name: Download and validate YouTube voice reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/private outputs/reports tools
          curl --fail --silent --show-error --location \
            "https://github.com/yt-dlp/yt-dlp/releases/download/${YT_DLP_VERSION}/yt-dlp" \
            --output tools/yt-dlp
          printf '%s  %s\n' "$YT_DLP_SHA256" tools/yt-dlp \
            | sha256sum --check --strict
          chmod 0700 tools/yt-dlp
          tools/yt-dlp --version

          yt_args=(
            --no-playlist
            --js-runtimes node
            --remote-components ejs:github
            --extractor-args 'youtube:player_client=tv,web_safari,web_embedded'
            --retries 3
            --fragment-retries 3
          )

          if [[ -n "${YOUTUBE_COOKIES_B64:-}" ]]; then
            printf '%s' "$YOUTUBE_COOKIES_B64" \
              | base64 --decode > data/private/youtube-cookies.txt
            chmod 0600 data/private/youtube-cookies.txt
            yt_args+=(--cookies data/private/youtube-cookies.txt)
            echo 'Using protected YouTube cookies secret.'
          else
            echo 'No YouTube cookies secret configured; using Node/EJS and alternate clients.'
          fi

          if ! actual_video_id="$(tools/yt-dlp \
            "${yt_args[@]}" \
            --skip-download \
            --print id \
            "$REFERENCE_VIDEO_URL")"; then
            echo '::error::YouTube blocked this hosted runner. Add an Actions secret named YOUTUBE_COOKIES_B64 containing a base64-encoded Netscape cookies file.'
            exit 1
          fi
          test "$actual_video_id" = "$REFERENCE_VIDEO_ID"

          tools/yt-dlp \
            "${yt_args[@]}" \
            --format 'bestaudio/best' \
            --output 'data/private/reference_source.%(ext)s' \
            "$REFERENCE_VIDEO_URL"

          source_path="$(find data/private -maxdepth 1 -type f \
            -name 'reference_source.*' ! -name '*.part' -print -quit)"
          test -n "$source_path"

          ffmpeg -y -hide_banner -loglevel error \
            -ss "$REFERENCE_START" \
            -i "$source_path" \
            -t "$REFERENCE_DURATION_SECONDS" \
            -vn -ac 1 -ar 24000 -c:a pcm_s24le \
            data/private/voice_001_ref.wav
          rm -f "$source_path" data/private/youtube-cookies.txt tools/yt-dlp

          ffprobe -v error \
            -show_entries stream=sample_rate,channels:format=duration \
            -of json data/private/voice_001_ref.wav \
            > outputs/reports/reference_info.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          info = json.loads(Path('outputs/reports/reference_info.json').read_text())
          duration = float(info['format']['duration'])
          stream = info['streams'][0]
          expected = float(os.environ['REFERENCE_DURATION_SECONDS'])
          if not expected - 1.0 <= duration <= expected + 1.0:
              raise SystemExit(
                  f'Reference duration is {duration:.2f}s; expected about {expected:.0f}s '
                  'from YouTube timestamp 07:00–07:40.'
              )
          if int(stream['channels']) != 1 or int(stream['sample_rate']) != 24000:
              raise SystemExit(f'Unexpected normalized reference format: {stream}')
          print(f'Validated YouTube reference: {duration:.2f}s, mono, 24 kHz')
          PY

      - name: Create isolated Indic Parler environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-parler
          .venv-parler/bin/python -m pip install --upgrade pip wheel setuptools
          .venv-parler/bin/pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.4.0' 'torchaudio==2.4.0' 'torchvision==0.19.0'
          .venv-parler/bin/pip install \
            'transformers==4.46.1' \
            'accelerate==1.1.1' \
            'numpy==1.26.4' \
            'soundfile==0.12.1' \
            'sentencepiece==0.2.0' \
            'protobuf==5.29.6' \
            'psutil==6.1.0'
          .venv-parler/bin/pip install --no-deps \
            'git+https://github.com/huggingface/parler-tts.git@d108732cd57788ec86bc857d99a6cabd66663d68'
          .venv-parler/bin/pip install 'descript-audio-codec==1.0.0'
          .venv-parler/bin/pip install --upgrade --force-reinstall \
            'numpy==1.26.4' 'transformers==4.46.1' 'protobuf==5.29.6'
          .venv-parler/bin/python - <<'PY'
          import google.protobuf
          import numpy
          import torch
          import transformers
          import parler_tts
          import dac

          assert torch.__version__.startswith('2.4.0')
          assert numpy.__version__ == '1.26.4'
          assert transformers.__version__ == '4.46.1'
          assert google.protobuf.__version__ == '5.29.6'
          print('Indic Parler environment verified')
          PY

      - name: Verify gated Indic Parler access
        shell: bash
        run: |
          set -euo pipefail
          .venv-parler/bin/python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download

          path = hf_hub_download(
              repo_id='ai4bharat/indic-parler-tts',
              filename='config.json',
              token=os.environ['HF_TOKEN'],
          )
          print(f'Gated model access verified: {path}')
          PY

      - name: Generate bounded pronunciation-first sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/parler_sources
          .venv-parler/bin/python scripts/run_with_memory_cap.py \
            --limit-mib 7900 \
            --timeout-seconds 7200 \
            --report outputs/reports/parler_memory.json \
            -- .venv-parler/bin/python scripts/generate_indic_parler_sources.py \
              --cases eval/voice_001_parler_seed_cases.json \
              --output-dir outputs/parler_sources \
              --model-id ai4bharat/indic-parler-tts \
              --max-unit-chars 60 \
              --min-unit-tokens 160 \
              --max-unit-tokens 640 \
              --max-unit-seconds 300

      - name: Validate source speech before conversion
        shell: bash
        run: |
          set -euo pipefail
          .venv-parler/bin/python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import soundfile as sf

          paths = sorted(Path('outputs/parler_sources').glob('*.wav'))
          if len(paths) != 4:
              raise SystemExit(f'Expected 4 Parler WAV files, found {len(paths)}')
          rows = []
          for path in paths:
              audio, sr = sf.read(path, dtype='float32', always_2d=False)
              audio = np.asarray(audio).squeeze()
              if audio.ndim != 1 or audio.size < sr // 2:
                  raise SystemExit(f'{path}: invalid mono waveform')
              if not np.isfinite(audio).all():
                  raise SystemExit(f'{path}: non-finite samples')
              peak = float(np.max(np.abs(audio)))
              rms = float(np.sqrt(np.mean(audio ** 2)))
              if not 0.01 < peak <= 1.0 or rms <= 0.001:
                  raise SystemExit(f'{path}: invalid levels peak={peak} rms={rms}')
              rows.append({
                  'file': path.name,
                  'sample_rate': sr,
                  'duration_seconds': round(audio.size / sr, 3),
                  'peak': round(peak, 6),
                  'rms': round(rms, 6),
              })
          Path('outputs/reports/source_validation.json').write_text(
              json.dumps(rows, indent=2), encoding='utf-8'
          )
          print(json.dumps(rows, indent=2))
          PY

      - name: Fully release Indic Parler environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .venv-parler
          rm -rf "$HF_HOME/hub/models--ai4bharat--indic-parler-tts"
          python -m pip cache purge || true
          sync
          free -h
          df -h

      - name: Fetch pinned Seed-VC source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor/seed-vc
          mkdir -p vendor/seed-vc
          git -C vendor/seed-vc init
          git -C vendor/seed-vc remote add origin https://github.com/Plachtaa/seed-vc.git
          git -C vendor/seed-vc fetch --depth=1 origin "$SEED_VC_SHA"
          git -C vendor/seed-vc checkout --detach FETCH_HEAD
          test "$(git -C vendor/seed-vc rev-parse HEAD)" = "$SEED_VC_SHA"

      - name: Create isolated Seed-VC v2 environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-seed
          .venv-seed/bin/python -m pip install --upgrade pip wheel setuptools
          .venv-seed/bin/pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.4.0' 'torchaudio==2.4.0' 'torchvision==0.19.0'
          .venv-seed/bin/pip install \
            'accelerate==1.1.1' \
            'transformers==4.46.3' \
            'numpy==1.26.4' \
            'scipy==1.13.1' \
            'librosa==0.10.2' \
            'soundfile==0.12.1' \
            'huggingface-hub==0.36.2' \
            'munch==4.0.0' \
            'einops==0.8.0' \
            'pydub==0.25.1' \
            'resemblyzer==0.1.4' \
            'jiwer==3.0.3' \
            'hydra-core==1.3.2' \
            'pyyaml==6.0.3' \
            'python-dotenv==1.1.1' \
            'psutil==6.1.0'
          .venv-seed/bin/pip install 'descript-audio-codec==1.0.0'
          .venv-seed/bin/pip install --upgrade --force-reinstall \
            'numpy==1.26.4' 'transformers==4.46.3' 'protobuf==5.29.6'
          .venv-seed/bin/python - <<'PY'
          import google.protobuf
          import hydra
          import librosa
          import numpy
          import soundfile
          import torch
          import transformers
          import dac

          assert torch.__version__.startswith('2.4.0')
          assert numpy.__version__ == '1.26.4'
          assert transformers.__version__ == '4.46.3'
          assert google.protobuf.__version__ == '5.29.6'
          print('Seed-VC environment verified')
          PY

      - name: Convert sources to private target voice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/final_voice
          .venv-seed/bin/python scripts/run_with_memory_cap.py \
            --limit-mib 7900 \
            --timeout-seconds 7200 \
            --report outputs/reports/seed_vc_memory.json \
            -- .venv-seed/bin/python scripts/run_seed_vc_batch.py \
              --seed-vc-dir vendor/seed-vc \
              --source-dir outputs/parler_sources \
              --reference data/private/voice_001_ref.wav \
              --output-dir outputs/final_voice \
              --diffusion-steps 40 \
              --intelligibility 0.85 \
              --similarity 0.90 \
              --top-p 0.90 \
              --temperature 1.0 \
              --repetition-penalty 1.05

      - name: Validate final converted waveforms
        shell: bash
        run: |
          set -euo pipefail
          .venv-seed/bin/python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import soundfile as sf

          paths = sorted(Path('outputs/final_voice').glob('*.wav'))
          if len(paths) != 4:
              raise SystemExit(f'Expected 4 final WAV files, found {len(paths)}')
          rows = []
          for path in paths:
              audio, sr = sf.read(path, dtype='float32', always_2d=False)
              audio = np.asarray(audio).squeeze()
              if audio.ndim != 1 or audio.size < sr // 2:
                  raise SystemExit(f'{path}: invalid mono waveform')
              if not np.isfinite(audio).all():
                  raise SystemExit(f'{path}: non-finite samples')
              peak = float(np.max(np.abs(audio)))
              rms = float(np.sqrt(np.mean(audio ** 2)))
              clipped = float(np.mean(np.abs(audio) >= 0.999))
              if not 0.01 < peak <= 1.0 or rms <= 0.001 or clipped > 0.001:
                  raise SystemExit(
                      f'{path}: invalid levels peak={peak} rms={rms} clipped={clipped}'
                  )
              rows.append({
                  'file': path.name,
                  'sample_rate': sr,
                  'duration_seconds': round(audio.size / sr, 3),
                  'peak': round(peak, 6),
                  'rms': round(rms, 6),
                  'clipped_sample_ratio': round(clipped, 8),
              })
          Path('outputs/reports/final_validation.json').write_text(
              json.dumps(rows, indent=2), encoding='utf-8'
          )
          print(json.dumps(rows, indent=2))
          PY

      - name: Encrypt lossless review package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/package
          cp -a outputs/final_voice outputs/package/
          cp -a outputs/parler_sources outputs/package/
          cp -a outputs/reports outputs/package/
          printf '%s\n' "$REVIEWED_CODE_SHA" > outputs/package/reviewed_code_sha.txt
          printf '%s\n' "$SEED_VC_SHA" > outputs/package/seed_vc_sha.txt
          tar -czf outputs/voice_001_parler_seed_vc.tar.gz -C outputs package
          openssl enc -aes-256-cbc -pbkdf2 -iter 250000 -salt \
            -in outputs/voice_001_parler_seed_vc.tar.gz \
            -out outputs/voice_001_parler_seed_vc.tar.gz.enc \
            -pass env:VOICE_001_KEY
          sha256sum outputs/voice_001_parler_seed_vc.tar.gz.enc \
            > outputs/voice_001_parler_seed_vc.tar.gz.enc.sha256
          rm -rf \
            outputs/package \
            outputs/final_voice \
            outputs/parler_sources \
            outputs/voice_001_parler_seed_vc.tar.gz

      - name: Remove private and model material
        if: always()
        shell: bash
        run: |
          rm -rf data/private .venv-parler .venv-seed vendor tools "$HF_HOME"

      - name: Upload encrypted benchmark only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: voice-001-parler-seed-vc-encrypted
          path: |
            outputs/voice_001_parler_seed_vc.tar.gz.enc
            outputs/voice_001_parler_seed_vc.tar.gz.enc.sha256
          if-no-files-found: error
          retention-days: 1